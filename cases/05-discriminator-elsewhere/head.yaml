openapi: 3.1.0
info:
  title: Reproduction
  version: "1.0"
paths:
  /widgets:
    get:
      operationId: getWidgets
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
  /pets:
    get:
      operationId: getPet
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
components:
  schemas:
    Widget:
      type: object
      required: [name, extra]
      properties:
        name:
          type: string
        extra:
          type: string
    Pet:
      oneOf:
        - $ref: "#/components/schemas/Cat"
        - $ref: "#/components/schemas/Dog"
      discriminator:
        propertyName: kind
        mapping:
          cat: "#/components/schemas/Cat"
          dog: "#/components/schemas/Dog"
    Cat:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
    Dog:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
